# Rebuilds and publishes the website when the site's code or settings change, without fetching new data.
# (The scheduled "Refresh data" workflow fetches data and then rebuilds the site the same way.)
# Uses the data already saved in the repository. If the build fails, the publish step is skipped and the
# previous version of the site stays online.
name: Publish site

on:
  push:
    branches: [main]
    paths:                    # only changes that affect the site
      - "src/site/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/publish-site.yml"
  workflow_dispatch: {}       # adds a "Run workflow" button for manual runs

concurrency:                  # same group as "Refresh data": never build while a data refresh is running
  group: refresh-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -r requirements.txt
      - name: Build the site
        run: python src/site/build_site.py
      - name: Package the site for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publish. Runs only if the build succeeded, so a broken build never replaces the live site.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write                      # allowed to publish to GitHub Pages
      id-token: write                   # proves to Pages that this workflow is the publisher
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Copy the built site to the cf-pages branch, which Cloudflare Pages publishes with no build step, so no
  # Cloudflare key is stored in GitHub. The branch holds a single commit, replaced each time. Main only.
  # This job installs no packages and checks out no code.
  cloudflare:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v8    # current major as of 2026-11-28
        with:
          name: github-pages                  # the package the build job made for GitHub Pages
      - name: Replace the cf-pages branch with this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          tar -xf artifact.tar -C site
          test -f site/index.html
          cd site
          git init -q -b cf-pages
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build $(date -u +%Y-%m-%dT%H:%MZ), run ${GITHUB_RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" cf-pages
