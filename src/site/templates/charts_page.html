{% extends "base.html" %}
{#- A page that is a heading, a short intro and a grid of chart cards (Job Losses, Duration, ...). -#}
{% from "_macros.html" import chart_card %}

{% block content %}
<div class="page-intro">
  <h1>{{ heading }}</h1>
  <p>{{ intro }}</p>
</div>
<div class="grid">
  {%- for c in charts %}
  {{ chart_card(c) }}
  {%- endfor %}
</div>
{% endblock %}
